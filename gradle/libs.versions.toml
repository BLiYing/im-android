# 依赖版本的唯一来源（Gradle Version Catalog）。
# 纪律：版本号只写在这里，模块的 build.gradle.kts 一律用 libs.xxx 引用，禁止散落硬编码版本。

[versions]
agp = "8.12.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
okhttp = "4.12.0"
# im-rtc SDK（通话）。联调期取本机 mavenLocal（见 settings.gradle.kts），发布后改回公网版本。
imrtc = "2.1.0"   # JitPack 正式版；本地联调改成未发布的版本号，见 settings.gradle.kts 里注释掉的 mavenLocal
serialization = "1.7.3"
coroutines = "1.9.0"
datastore = "1.1.1"
room = "2.6.1"
lucide = "1.1.0"
coil = "2.7.0"
zxing = "3.5.3"
# CameraX：扫一扫取景（QRCODE P0 接收方半）。解码仍用 zxing-core（已引入），不叠 ML Kit。
camerax = "1.4.1"
ksp = "2.0.21-1.0.28"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
exifinterface = "1.3.7"
# Media3（ExoPlayer）：视频播放。1.4.1 是与 compileSdk 36 / AGP 8.12 稳定搭配的一档。
media3 = "1.4.1"

[libraries]
# --- 基础 ---
androidx-core-ktx           = { group = "androidx.core",             name = "core-ktx",                 version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",    version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { group = "androidx.activity",         name = "activity-compose",         version.ref = "activityCompose" }

# --- Compose（版本由 BOM 统一对齐，成员不写版本号）---
compose-bom                 = { group = "androidx.compose",          name = "compose-bom",              version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",       name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-foundation          = { group = "androidx.compose.foundation", name = "foundation" }
# EXIF 方向：相机拍的照片字节里是横的、靠 EXIF 标记转 90°，解码后不转就会存成躺倒的图。
androidx-exifinterface      = { group = "androidx.exifinterface",     name = "exifinterface",            version.ref = "exifinterface" }
media3-exoplayer            = { group = "androidx.media3",            name = "media3-exoplayer",         version.ref = "media3" }
# 只为 PlayerView 的 Surface 与 resizeMode（自绘控件仍是我们自己的，见 VideoPlayer.kt）
media3-ui                   = { group = "androidx.media3",            name = "media3-ui",                version.ref = "media3" }

# --- 网络 / 序列化（协议 SDK 用）---
# OkHttp：WebSocket 能设请求头，故走 PROTOCOL §1 首选的 Authorization: Bearer，而非 ?token= 查询串。
okhttp                      = { group = "com.squareup.okhttp3",      name = "okhttp",                   version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",      name = "logging-interceptor",      version.ref = "okhttp" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- 图标（lucide，ISC 许可）---
# 与 im-web 的 lucide-react 同一套设计语言；iOS 用 SF Symbols，三端语义对齐。
# 选它而不是 Material Icons：后者风格偏 Google，与本项目的 Telegram 观感不合。
icons-lucide                = { group = "com.composables",         name = "icons-lucide",             version.ref = "lucide" }

# --- 图片加载 ---
# Coil 2.x（不是 coil3）：2.x 是纯 Android，依赖更少；本项目不做多平台。
# 头像与图片消息都走它，自带内存+磁盘缓存，省得自己写一套。
coil-compose                = { group = "io.coil-kt",              name = "coil-compose",             version.ref = "coil" }
coil-video                  = { group = "io.coil-kt",              name = "coil-video",             version.ref = "coil" }

# --- 二维码编码（「我」页名片码）---
# zxing core 是**纯 JVM**、无 Android 依赖：只要它把串编成 BitMatrix，画布交给 Compose 自己画。
# 因此编码那一步能进普通单测（不需要 Robolectric/仪器测试）。
# 只取 core，不取 android-core / android-integration——后两个带 Activity 与相机扫码，改用 CameraX 自己接。
zxing-core                  = { group = "com.google.zxing",           name = "core",                     version.ref = "zxing" }

# --- 相机取景（扫一扫，QRCODE P0 接收方半）---
# 只取预览+分析所需的四个模块；解码复用上面的 zxing-core（纯 JVM，对着 ImageAnalysis 的 Y 平面算）。
camerax-core                = { group = "androidx.camera",            name = "camera-core",              version.ref = "camerax" }
camerax-camera2              = { group = "androidx.camera",            name = "camera-camera2",           version.ref = "camerax" }
camerax-lifecycle           = { group = "androidx.camera",            name = "camera-lifecycle",         version.ref = "camerax" }
camerax-view                = { group = "androidx.camera",            name = "camera-view",              version.ref = "camerax" }

# --- 本地存储（对应 iOS 的 SQLite/FMDB、Web 的 IndexedDB）---
androidx-datastore-prefs    = { group = "androidx.datastore",        name = "datastore-preferences",    version.ref = "datastore" }
room-runtime                = { group = "androidx.room",             name = "room-runtime",             version.ref = "room" }
room-ktx                    = { group = "androidx.room",             name = "room-ktx",                 version.ref = "room" }
room-compiler               = { group = "androidx.room",             name = "room-compiler",            version.ref = "room" }
room-testing                = { group = "androidx.room",             name = "room-testing",             version.ref = "room" }

# --- 测试 ---
junit                       = { group = "junit",                     name = "junit",                    version.ref = "junit" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",  version.ref = "coroutines" }
androidx-junit              = { group = "androidx.test.ext",         name = "junit",                    version.ref = "androidxJunit" }
espresso-core               = { group = "androidx.test.espresso",    name = "espresso-core",            version.ref = "espresso" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
imrtc-uikit                 = { group = "com.github.BLiYing.im-rtc-android", name = "call-uikit",          version.ref = "imrtc" }
imrtc-webrtc                = { group = "com.github.BLiYing.im-rtc-android", name = "call-engine-webrtc",   version.ref = "imrtc" }

[plugins]
android-application  = { id = "com.android.application",                  version.ref = "agp" }
android-library      = { id = "com.android.library",                      version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
