# 依赖版本的唯一来源（Gradle Version Catalog）。
# 纪律：版本号只写在这里，模块的 build.gradle.kts 一律用 libs.xxx 引用，禁止散落硬编码版本。

[versions]
agp = "8.12.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"
datastore = "1.1.1"
room = "2.6.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# --- 基础 ---
androidx-core-ktx           = { group = "androidx.core",             name = "core-ktx",                 version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",    version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { group = "androidx.activity",         name = "activity-compose",         version.ref = "activityCompose" }

# --- Compose（版本由 BOM 统一对齐，成员不写版本号）---
compose-bom                 = { group = "androidx.compose",          name = "compose-bom",              version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",       name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }

# --- 网络 / 序列化（协议 SDK 用）---
# OkHttp：WebSocket 能设请求头，故走 PROTOCOL §1 首选的 Authorization: Bearer，而非 ?token= 查询串。
okhttp                      = { group = "com.squareup.okhttp3",      name = "okhttp",                   version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",      name = "logging-interceptor",      version.ref = "okhttp" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- 本地存储（对应 iOS 的 SQLite/FMDB、Web 的 IndexedDB）---
androidx-datastore-prefs    = { group = "androidx.datastore",        name = "datastore-preferences",    version.ref = "datastore" }
room-runtime                = { group = "androidx.room",             name = "room-runtime",             version.ref = "room" }
room-ktx                    = { group = "androidx.room",             name = "room-ktx",                 version.ref = "room" }

# --- 测试 ---
junit                       = { group = "junit",                     name = "junit",                    version.ref = "junit" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",  version.ref = "coroutines" }
androidx-junit              = { group = "androidx.test.ext",         name = "junit",                    version.ref = "androidxJunit" }
espresso-core               = { group = "androidx.test.espresso",    name = "espresso-core",            version.ref = "espresso" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",       name = "ui-test-manifest" }

[plugins]
android-application  = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
